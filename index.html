<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comprovantes</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <meta name="theme-color" content="#0d6efd" />
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      text-align: center;
      padding: 48px 24px;
      color: #1a1a1a;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { font-size: 28px; }
    p { color: #555; line-height: 1.5; }
    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #0d6efd;
      color: #fff;
      cursor: pointer;
      margin-top: 16px;
    }
    button:disabled { background: #aac6f7; }
    #status { color: #0d6efd; font-weight: 600; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>📋 Comprovantes</h1>
  <p>
    Depois de instalar este app na tela inicial, ele vai aparecer na lista de
    compartilhamento do seu celular. Assim, você pode enviar um comprovante
    direto do app do banco para cá.
  </p>
  <button id="btnInstalar" style="display:none;">Instalar app</button>
  <p id="status"></p>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('/service-worker.js')
        .then(() => console.log('Service worker registrado com sucesso'))
        .catch((err) => console.error('Erro ao registrar service worker', err));
    }

    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('btnInstalar').style.display = 'inline-block';
    });

    document.getElementById('btnInstalar').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      document.getElementById('status').textContent =
        outcome === 'accepted' ? 'App instalado! ✅' : '';
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('btnInstalar').style.display = 'none';
      document.getElementById('status').textContent = 'App instalado! ✅';
    });
  </script>
</body>
</html>
