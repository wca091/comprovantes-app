<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comprovante recebido</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      text-align: center;
      padding: 48px 24px;
      color: #1a1a1a;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { font-size: 26px; color: #198754; }
    #info {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
      margin-top: 20px;
    }
    #info p { margin: 6px 0; color: #333; }
    a { display: inline-block; margin-top: 24px; color: #0d6efd; }
  </style>
</head>
<body>
  <h1>✅ Comprovante recebido!</h1>
  <div id="info">Carregando informações do arquivo...</div>
  <a href="/">← Voltar</a>

  <script>
    async function mostrarInfo() {
      try {
        const cache = await caches.open('comprovantes-share-cache');
        const response = await cache.match('/ultimo-comprovante-info');

        if (response) {
          const info = await response.json();
          document.getElementById('info').innerHTML = `
            <p><strong>Arquivo:</strong> ${info.name || '(sem nome)'}</p>
            <p><strong>Tipo:</strong> ${info.type || 'desconhecido'}</p>
            <p><strong>Tamanho:</strong> ${(info.size / 1024).toFixed(1)} KB</p>
            <p style="color:#888; margin-top:10px;">
              Este arquivo ainda não é enviado a lugar nenhum — isso é só
              para confirmar que o compartilhamento está funcionando.
              Na próxima etapa, ele vai ser enviado ao servidor para leitura
              automática dos dados.
            </p>
          `;
        } else {
          document.getElementById('info').textContent = 'Nenhum arquivo encontrado.';
        }
      } catch (e) {
        document.getElementById('info').textContent = 'Erro ao ler o arquivo: ' + e.message;
      }
    }
    mostrarInfo();
  </script>
</body>
</html>
